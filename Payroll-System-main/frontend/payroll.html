<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PayrollPro - Payroll Calculator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <div id="sidebarContainer"></div>
    <main class="main-content">
        <div class="page-header d-flex justify-content-between align-items-center">
            <div>
                <h1 class="page-title">Payroll Calculator</h1>
                <p class="text-muted mb-0">Calculate salary and generate payslips</p>
            </div>
            <button class="btn btn-outline-secondary" id="themeToggle"><i class="bi bi-moon-stars"></i></button>
        </div>

        <div class="row g-4">
            <div class="col-lg-5">
                <div class="card shadow-sm">
                    <div class="card-header bg-transparent">
                        <h5 class="mb-0"><i class="bi bi-person-check me-2"></i>Select Employee</h5>
                    </div>
                    <div class="card-body">
                        <select class="form-select form-select-lg mb-3" id="employeeSelect">
                            <option value="">Choose an employee...</option>
                        </select>
                        <button class="btn btn-primary w-100" id="calculateBtn" disabled>
                            <i class="bi bi-calculator me-1"></i>Calculate Salary
                        </button>
                    </div>
                </div>
            </div>
            <div class="col-lg-7">
                <div class="card shadow-sm" id="salaryBreakdown" style="display:none">
                    <div class="card-header bg-transparent d-flex justify-content-between align-items-center">
                        <h5 class="mb-0"><i class="bi bi-receipt me-2"></i>Salary Breakdown</h5>
                        <button class="btn btn-success btn-sm" id="generatePayslipBtn">
                            <i class="bi bi-file-earmark-text me-1"></i>Generate Payslip
                        </button>
                    </div>
                    <div class="card-body">
                        <div class="row g-3" id="breakdownContent"></div>
                    </div>
                </div>
                <div class="card shadow-sm" id="noSelection">
                    <div class="card-body text-center py-5">
                        <i class="bi bi-calculator display-1 text-muted"></i>
                        <p class="text-muted mt-3">Select an employee to calculate salary</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Payslip Modal -->
        <div class="modal fade" id="payslipModal" tabindex="-1">
            <div class="modal-dialog modal-lg">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Salary Payslip</h5>
                        <div>
                            <button class="btn btn-outline-primary btn-sm me-2" onclick="printPayslip()">
                                <i class="bi bi-printer me-1"></i>Print
                            </button>
                            <button class="btn btn-outline-success btn-sm me-2" onclick="downloadPayslipPDF()">
                                <i class="bi bi-download me-1"></i>Download PDF
                            </button>
                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                        </div>
                    </div>
                    <div class="modal-body" id="payslipContent"></div>
                </div>
            </div>
        </div>
    </main>
    <div id="toastContainer" class="toast-container position-fixed bottom-0 end-0 p-3"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="js/script.js"></script>
    <script>
        checkAuth();
        renderSidebar('payroll');
        initPayrollPage();
    </script>
</body>
</html>
